<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Tight Ship</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0e0e10;
  --bg2: #16161a;
  --bg3: #1e1e24;
  --bg4: #26262e;
  --border: #2e2e38;
  --text: #f0f0f4;
  --muted: #7a7a8c;
  --accent: #e8ff3c;
  --accent2: #3cffe8;
  --accent3: #ff6b3c;
  --high: #ff4444;
  --med: #ffaa00;
  --low: #44cc88;
  --radius: 12px;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body, #root { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}

/* SCROLLABLE AREA */
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.scroll::-webkit-scrollbar { width: 3px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* AUTH SCREEN */
.auth-wrap {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  background: var(--bg);
}
.auth-logo {
  font-family: var(--font-display);
  font-size: 56px;
  letter-spacing: 3px;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 4px;
}
.auth-tag {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 48px;
}
.auth-card {
  width: 100%;
  max-width: 380px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
}
.auth-tabs {
  display: flex;
  gap: 2px;
  background: var(--bg3);
  border-radius: 8px;
  padding: 3px;
  margin-bottom: 24px;
}
.auth-tab {
  flex: 1;
  padding: 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.auth-tab.active {
  background: var(--accent);
  color: var(--bg);
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus { border-color: var(--accent); }
.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-family: var(--font-display);
  font-size: 20px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-top: 8px;
}
.btn-primary:active { opacity: 0.85; }
.auth-err {
  color: var(--high);
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
}

/* APP SHELL */
.app-shell {
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* TOP BAR */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
}
.topbar-logo {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: 2px;
  color: var(--accent);
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.15s;
}
.icon-btn:active { background: var(--bg4); }

/* NAV */
.bottom-nav {
  display: flex;
  border-top: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 10px 4px 8px;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color 0.15s;
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 20px; line-height: 1; }

/* PAGE CONTENT */
.page-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.page {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.page.active {
  opacity: 1;
  pointer-events: all;
}
.page-header {
  padding: 18px 18px 12px;
  flex-shrink: 0;
}
.page-title {
  font-family: var(--font-display);
  font-size: 36px;
  letter-spacing: 2px;
  line-height: 1;
  color: var(--text);
}
.page-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.5px;
}
.page-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 18px 100px;
}

/* SECTION */
.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin: 20px 0 10px;
}

/* TASK CARD */
.task-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  margin-bottom: 8px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  transition: border-color 0.15s;
  position: relative;
  overflow: hidden;
}
.task-card.done { opacity: 0.45; }
.task-card .priority-bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.priority-bar.high { background: var(--high); }
.priority-bar.medium { background: var(--med); }
.priority-bar.low { background: var(--low); }

.task-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  flex-shrink: 0;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  transition: all 0.2s;
  margin-top: 1px;
}
.task-check.checked {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}
.task-body { flex: 1; min-width: 0; }
.task-title {
  font-weight: 500;
  font-size: 14px;
  line-height: 1.4;
  word-break: break-word;
}
.task-title.done { text-decoration: line-through; }
.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
  align-items: center;
}
.tag-pill {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--bg4);
  color: var(--muted);
  text-transform: uppercase;
}
.priority-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 2px 7px;
  border-radius: 20px;
  text-transform: uppercase;
}
.priority-badge.high { background: #ff444422; color: var(--high); }
.priority-badge.medium { background: #ffaa0022; color: var(--med); }
.priority-badge.low { background: #44cc8822; color: var(--low); }

.task-note {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.4;
}
.task-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.task-btn {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.task-btn:active { background: var(--bg4); }
.task-btn.danger { border-color: #ff444444; color: var(--high); }

/* ROLLOVER badge */
.rollover-badge {
  font-size: 10px;
  background: #ff6b3c22;
  color: var(--accent3);
  border: 1px solid #ff6b3c44;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 600;
}

/* GOAL CARD */
.goal-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}
.goal-card .priority-bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.goal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.goal-title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.goal-title.done { text-decoration: line-through; opacity: 0.5; }
.goal-note { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.goal-footer { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.goal-due { font-size: 11px; color: var(--muted); }
.goal-actions { display: flex; gap: 6px; margin-top: 8px; }
.goal-complete-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  transition: all 0.2s;
}
.goal-complete-btn.done {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}

/* PROGRESS BAR */
.progress-wrap { margin: 8px 0 4px; }
.progress-track {
  height: 4px;
  background: var(--bg4);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* QUICK ADD FAB */
.fab {
  position: fixed;
  bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  right: 20px;
  width: 54px; height: 54px;
  background: var(--accent);
  border-radius: 50%;
  border: none;
  color: var(--bg);
  font-size: 28px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(232, 255, 60, 0.35);
  z-index: 50;
  transition: transform 0.15s, box-shadow 0.15s;
}
.fab:active { transform: scale(0.92); box-shadow: 0 2px 10px rgba(232, 255, 60, 0.2); }

/* MODAL OVERLAY */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-sheet {
  width: 100%;
  background: var(--bg2);
  border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--border);
  padding: 12px 20px 32px;
  max-height: 92vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 20px;
}
.modal-title {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

/* FORM ELEMENTS IN MODAL */
.form-field { margin-bottom: 16px; }
.form-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 7px;
}
.form-input, .form-textarea, .form-select {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
.form-textarea { resize: none; min-height: 80px; }
.form-select { cursor: pointer; }
.form-select option { background: var(--bg3); }

/* CHIP GROUP */
.chip-group { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 6px 13px;
  border-radius: 20px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}
.chip.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}
.chip.priority-high.selected { background: var(--high); border-color: var(--high); color: #fff; }
.chip.priority-med.selected { background: var(--med); border-color: var(--med); color: var(--bg); }
.chip.priority-low.selected { background: var(--low); border-color: var(--low); color: var(--bg); }

/* TOGGLE */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0;
}
.toggle-label { font-size: 14px; font-weight: 500; }
.toggle {
  width: 46px; height: 26px;
  background: var(--bg4);
  border-radius: 13px;
  border: 1px solid var(--border);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle-knob {
  width: 20px; height: 20px;
  background: var(--muted);
  border-radius: 50%;
  position: absolute;
  top: 2px; left: 2px;
  transition: transform 0.2s, background 0.2s;
}
.toggle.on .toggle-knob { transform: translateX(20px); background: var(--bg); }

/* STATS */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stat-num {
  font-family: var(--font-display);
  font-size: 42px;
  letter-spacing: 1px;
  line-height: 1;
  color: var(--accent);
}
.stat-label {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

/* STREAK */
.streak-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.streak-dot {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  font-weight: 700;
  color: var(--muted);
}
.streak-dot.active { background: var(--accent); color: var(--bg); }
.streak-dot.partial { background: var(--bg3); border: 1px solid var(--accent); color: var(--accent); }
.streak-dot.empty { background: var(--bg3); border: 1px solid var(--border); }

/* MOTIVATOR */
.motivator-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
}
.motivator-quote {
  font-size: 16px;
  line-height: 1.6;
  color: var(--text);
  font-style: italic;
  margin-bottom: 8px;
}
.motivator-source { font-size: 12px; color: var(--muted); }
.motivator-btn {
  width: 100%;
  padding: 13px;
  background: var(--bg3);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 8px;
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 2px;
  cursor: pointer;
  margin-bottom: 10px;
  transition: background 0.15s;
}
.motivator-btn:active { background: var(--bg4); }

/* REVIEW */
.review-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 10px;
}
.review-card h3 {
  font-family: var(--font-display);
  font-size: 20px;
  letter-spacing: 1px;
  margin-bottom: 12px;
  color: var(--accent);
}

/* SETTINGS */
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.settings-label { font-size: 14px; font-weight: 500; }
.settings-value { font-size: 13px; color: var(--muted); }
.settings-btn {
  padding: 10px 18px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
}
.settings-btn.danger { border-color: #ff444444; color: var(--high); }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--muted);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; line-height: 1.5; }

/* LOADING */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 120px;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* CHRONIC DEFERRED WARNING */
.warn-card {
  background: #ff6b3c11;
  border: 1px solid #ff6b3c44;
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--accent3);
  line-height: 1.5;
}
.warn-card strong { font-weight: 600; }

/* DATE BADGE */
.date-badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--muted);
  padding: 3px 10px;
  background: var(--bg3);
  border-radius: 20px;
  display: inline-block;
}

/* TODAY HEADER */
.today-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 16px 18px 0;
  flex-shrink: 0;
}
.today-date {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}
</style>
</head>

<div id="root"></div>
<script type="text/babel">

const fmtDay = () => new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

// ─── AUTH SCREEN ──────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [tab, setTab] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setErr(''); setLoading(true);
    if (!email || !password) { setErr('Email and password required'); setLoading(false); return; }
    if (tab === 'signup') {
      const { error } = await _supa.auth.signUp({ email, password, options: { data: { name } } });
      if (error) { setErr(error.message); setLoading(false); return; }
      setErr('Check your email to confirm your account, then log in.');
      setLoading(false); return;
    } else {
      const { data, error } = await _supa.auth.signInWithPassword({ email, password });
      if (error) { setErr(error.message); setLoading(false); return; }
      onAuth(data.user);
    }
    setLoading(false);
  };

  return (
    <div className="auth-wrap">
      <div className="auth-logo">TIGHT SHIP</div>
      <div className="auth-tag">Run your life. Type shit.</div>
      <div className="auth-card">
        <div className="auth-tabs">
          <button className={`auth-tab${tab==='login'?' active':''}`} onClick={()=>setTab('login')}>Login</button>
          <button className={`auth-tab${tab==='signup'?' active':''}`} onClick={()=>setTab('signup')}>Sign Up</button>
        </div>
        {tab === 'signup' && (
          <div className="field">
            <label>Name</label>
            <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Your name"/>
          </div>
        )}
        <div className="field">
          <label>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com"/>
        </div>
        <div className="field">
          <label>Password</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••"
            onKeyDown={e=>e.key==='Enter'&&submit()}/>
        </div>
        <button className="btn-primary" onClick={submit} disabled={loading}>
          {loading ? 'LOADING...' : tab==='login' ? 'LOG IN' : 'SIGN UP'}
        </button>
        {err && <div className="auth-err">{err}</div>}
      </div>
    </div>
  );
}

// ─── TASK CARD ────────────────────────────────────────────────
function TaskCard({ task, onCheck, onDefer, onDelete, rolloverCount }) {
  const [expanded, setExpanded] = useState(false);
  return (
    <div className={`task-card${task.status==='done'?' done':''}`} onClick={()=>setExpanded(e=>!e)}>
      <div className={`priority-bar ${task.priority}`}/>
      <div className={`task-check${task.status==='done'?' checked':''}`}
        onClick={e=>{e.stopPropagation(); onCheck(task);}}>
        {task.status==='done' && '✓'}
      </div>
      <div className="task-body">
        <div className={`task-title${task.status==='done'?' done':''}`}>{task.title}</div>
        <div className="task-meta">
          <span className={`priority-badge ${task.priority}`}>{task.priority}</span>
          {task.tags && task.tags.map(t=><span key={t} className="tag-pill">{t}</span>)}
          {rolloverCount > 0 && <span className="rollover-badge">↻ rolled {rolloverCount}x</span>}
        </div>
        {task.notes && <div className="task-note">{task.notes}</div>}
        {expanded && task.status !== 'done' && (
          <div className="task-actions" onClick={e=>e.stopPropagation()}>
            <button className="task-btn" onClick={()=>onDefer(task)}>Roll to Tomorrow</button>
            <button className="task-btn danger" onClick={()=>onDelete(task)}>Delete</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── GOAL CARD ────────────────────────────────────────────────
function GoalCard({ goal, linkedTasks, onToggle, onDelete }) {
  const done = linkedTasks.filter(t=>t.status==='done').length;
  const total = linkedTasks.length;
  const pct = total > 0 ? Math.round((done/total)*100) : (goal.status==='complete' ? 100 : 0);
  return (
    <div className="goal-card">
      <div className={`priority-bar ${goal.priority}`}/>
      <div className="goal-header">
        <div style={{flex:1}}>
          <div className={`goal-title${goal.status==='complete'?' done':''}`}>{goal.title}</div>
          {goal.notes && <div className="goal-note">{goal.notes}</div>}
        </div>
        <button className={`goal-complete-btn${goal.status==='complete'?' done':''}`}
          onClick={()=>onToggle(goal)}>
          {goal.status==='complete' ? '✓' : '○'}
        </button>
      </div>
      <div className="goal-footer">
        <span className={`priority-badge ${goal.priority}`}>{goal.priority}</span>
        {goal.tags && goal.tags.map(t=><span key={t} className="tag-pill">{t}</span>)}
        {goal.due_date && <span className="goal-due">Due {fmtDate(goal.due_date)}</span>}
      </div>
      {total > 0 && (
        <div className="progress-wrap">
          <div className="progress-track">
            <div className="progress-fill" style={{width: pct+'%'}}/>
          </div>
          <div className="progress-label">{done}/{total} tasks · {pct}%</div>
        </div>
      )}
      <div className="goal-actions">
        <button className="task-btn danger" onClick={()=>onDelete(goal)}>Delete</button>
      </div>
    </div>
  );
}

        <div className="form-field">

          <textarea className="form-textarea" value={notes} onChange={e=>setNotes(e.target.value)}

        <div className="form-field">
          <label className="form-label">Priority</label>

            <div className={`chip priority-high${priority==='high'?' selected':''}`} onClick={()=>setPriority('high')}>🔴 High</div>

// ─── TODAY PAGE ───────────────────────────────────────────────
function TodayPage({ tasks, rollovers, onCheck, onDefer, onDelete, loading }) {
  const todayStr = today();
  const todayTasks = tasks
    .filter(t => t.scheduled_date === todayStr || (t.tier === 'daily' && t.scheduled_date === todayStr))
    .sort((a,b) => {
      const po = {high:0,medium:1,low:2};
      return (po[a.priority]||1) - (po[b.priority]||1);
    });

  const pending = todayTasks.filter(t=>t.status==='pending');
  const done = todayTasks.filter(t=>t.status==='done');

  // Chronic defers
  const chronicTasks = todayTasks.filter(t => {
    const count = rollovers.filter(r=>r.task_id===t.id).length;
    return count >= 3;
  });

  const getRolloverCount = (taskId) => rollovers.filter(r=>r.task_id===taskId).length;

  if (loading) return <div className="loading">Loading...</div>;

  return (
    <>
      <div className="today-header">
        <div className="page-title" style={{fontSize:38}}>TODAY</div>
        <div className="today-date">{fmtDay()}</div>
      </div>
      <div className="page-body">
        {chronicTasks.length > 0 && (
          <>
            <div className="section-label">⚠ Chronic Deferrals</div>
            {chronicTasks.map(t=>(
              <div key={t.id} className="warn-card">
                <strong>"{t.title}"</strong> has been deferred {getRolloverCount(t.id)} times.
                Time to tackle it or drop it.
              </div>
            ))}
          </>
        )}

        {pending.length === 0 && done.length === 0 ? (
          <div className="empty-state">
            <div className="empty-icon">📋</div>
            <div className="empty-text">Nothing scheduled for today.<br/>Hit + to add tasks.</div>
          </div>
        ) : (
          <>
            {pending.length > 0 && (
              <>
                <div className="section-label">To Do · {pending.length}</div>
                {pending.map(t=>(
                  <TaskCard key={t.id} task={t}
                    rolloverCount={getRolloverCount(t.id)}
                    onCheck={onCheck} onDefer={onDefer} onDelete={onDelete}/>
                ))}
              </>
            )}
            {done.length > 0 && (
              <>
                <div className="section-label">Done · {done.length}</div>
                {done.map(t=>(
                  <TaskCard key={t.id} task={t}
                    rolloverCount={getRolloverCount(t.id)}
                    onCheck={onCheck} onDefer={onDefer} onDelete={onDelete}/>
                ))}
              </>
            )}
          </>
        )}
      </div>
    </>
  );
}

// ─── WEEKLY PAGE ──────────────────────────────────────────────
function WeeklyPage({ tasks, rollovers, onCheck, onDefer, onDelete, loading }) {
  const getWeekDates = () => {
    const now = new Date();
    const day = now.getDay();
    const monday = new Date(now); monday.setDate(now.getDate() - (day === 0 ? 6 : day-1));
    const dates = [];
    for (let i=0;i<7;i++) { const d=new Date(monday); d.setDate(monday.getDate()+i); dates.push(d.toISOString().split('T')[0]); }
    return dates;
  };
  const weekDates = getWeekDates();
  const weekTasks = tasks
    .filter(t => t.tier === 'weekly' || weekDates.includes(t.scheduled_date))
    .sort((a,b)=>{ const po={high:0,medium:1,low:2}; return po[a.priority]-po[b.priority]; });

  const getRolloverCount = (id) => rollovers.filter(r=>r.task_id===id).length;

  if (loading) return <div className="loading">Loading...</div>;

  return (
    <>
      <div className="page-header">
        <div className="page-title">THIS WEEK</div>
        <div className="page-sub">Weekly tasks & priorities</div>
      </div>
      <div className="page-body">
        {weekTasks.length === 0 ? (
          <div className="empty-state">
            <div className="empty-icon">📆</div>
            <div className="empty-text">No tasks for this week yet.</div>
          </div>
        ) : weekTasks.map(t=>(
          <TaskCard key={t.id} task={t}
            rolloverCount={getRolloverCount(t.id)}
            onCheck={onCheck} onDefer={onDefer} onDelete={onDelete}/>
        ))}
      </div>
    </>
  );
}

// ─── STATS PAGE ───────────────────────────────────────────────
function StatsPage({ tasks, rollovers }) {
  const todayStr = today();

  const last7 = Array.from({length:7},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-i);
    return d.toISOString().split('T')[0];
  }).reverse();

  const totalDone = tasks.filter(t=>t.status==='done').length;
  const totalTasks = tasks.length;
  const totalDeferred = rollovers.length;

  const streak = (() => {
    let s = 0;
    for (const d of [...last7].reverse()) {
      const dayTasks = tasks.filter(t=>t.scheduled_date===d);
      if (dayTasks.length > 0 && dayTasks.every(t=>t.status==='done')) s++;
      else break;
    }
    return s;
  })();

  const getDayLabel = (d) => new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}).slice(0,1);
  const getDayStatus = (d) => {
    const dayTasks = tasks.filter(t=>t.scheduled_date===d);
    if (dayTasks.length === 0) return 'empty';
    const allDone = dayTasks.every(t=>t.status==='done');
    return allDone ? 'active' : 'partial';
  };

  const topDeferred = Object.entries(
    rollovers.reduce((acc,r)=>{
      const t = tasks.find(t=>t.id===r.task_id);
      if (t) acc[t.title] = (acc[t.title]||0)+1;
      return acc;
    }, {})
  ).sort((a,b)=>b[1]-a[1]).slice(0,3);

  return (
    <>
      <div className="page-header">
        <div className="page-title">STATS</div>
        <div className="page-sub">Your momentum</div>
      </div>
      <div className="page-body">
        <div className="stat-grid">
          <div className="stat-card">
            <div className="stat-num">{totalDone}</div>
            <div className="stat-label">Total Done</div>
          </div>
          <div className="stat-card">
            <div className="stat-num" style={{color:'var(--accent2)'}}>{streak}</div>
            <div className="stat-label">Day Streak</div>
          </div>
          <div className="stat-card">
            <div className="stat-num" style={{color:'var(--med)'}}>
              {totalTasks > 0 ? Math.round((totalDone/totalTasks)*100) : 0}%
            </div>
            <div className="stat-label">Completion</div>
          </div>
          <div className="stat-card">
            <div className="stat-num" style={{color:'var(--accent3)'}}>{totalDeferred}</div>
            <div className="stat-label">Deferred</div>
          </div>
        </div>

        <div className="section-label">Last 7 Days</div>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:16,marginBottom:16}}>
          <div className="streak-row">
            {last7.map(d=>(
              <div key={d} className={`streak-dot ${getDayStatus(d)}`}>{getDayLabel(d)}</div>
            ))}
          </div>
          <div style={{fontSize:12,color:'var(--muted)',marginTop:10}}>
            🟡 = partial &nbsp;🟢 = all done
          </div>
        </div>

        {topDeferred.length > 0 && (
          <>
            <div className="section-label">Most Deferred Tasks</div>
            {topDeferred.map(([title, count])=>(
              <div key={title} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:10,
                padding:'12px 14px',marginBottom:8}}>
                <span style={{fontSize:14,flex:1}}>{title}</span>
                <span className="rollover-badge">↻ {count}x</span>
              </div>
            ))}
          </>
        )}
      </div>
    </>
  );
}

  };

  const generate = async () => {
    setLoading(true); setSaved(false);
    try {
      const resp = await fetch(CF_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'motivator' })
      });
      const data = await resp.json();
      setQuote(data);
    } catch(e) {
      setQuote({ quote: "Stay disciplined. Show up every day. The results will follow.", source: "Tight Ship" });
    }
    setLoading(false);
  };

  const saveQuote = async () => {
    if (!quote) return;
    await _supa.from('motivators').insert({ user_id: userId, quote: quote.quote, source: quote.source });
    setSaved(true);
    loadSaved();
  };

  const deleteQuote = async (id) => {
    await _supa.from('motivators').delete().eq('id', id);
    loadSaved();
  };

  return (
    <>
      <div className="page-header">
        <div className="page-title">MOTIVATE</div>
        <div className="page-sub">Fire yourself up</div>
      </div>
      <div className="page-body">
        {quote && (
          <div className="motivator-box">
            <div className="motivator-quote">"{quote.quote}"</div>
            {quote.source && <div className="motivator-source">— {quote.source}</div>}
            <button className="task-btn" style={{marginTop:12}} onClick={saveQuote}>
              {saved ? '✓ Saved' : 'Save This One'}
            </button>
          </div>
        )}
        <button className="motivator-btn" onClick={generate} disabled={loading}>
          {loading ? 'GENERATING...' : quote ? '↺ ANOTHER ONE' : '⚡ HIT ME'}
        </button>

        {savedQuotes.length > 0 && (
          <>
            <div className="section-label">Saved Quotes</div>
            {savedQuotes.map(q=>(
              <div key={q.id} className="motivator-box" style={{textAlign:'left'}}>
                <div className="motivator-quote" style={{fontSize:14}}>"{q.quote}"</div>
                {q.source && <div className="motivator-source" style={{marginBottom:8}}>— {q.source}</div>}
                <button className="task-btn danger" onClick={()=>deleteQuote(q.id)}>Remove</button>
              </div>
            ))}
          </>
        )}
      </div>
    </>
  );
}

// ─── SETTINGS PAGE ────────────────────────────────────────────
function SettingsPage({ user, onSignOut }) {
  return (
    <>
      <div className="page-header">
        <div className="page-title">SETTINGS</div>
        <div className="page-sub">Account & preferences</div>
      </div>
      <div className="page-body">
        <div className="section-label">Account</div>
        <div className="settings-row">
          <span className="settings-label">Email</span>
          <span className="settings-value">{user?.email}</span>
        </div>
        <div className="settings-row" style={{marginTop:8}}>
          <span className="settings-label">Sign out</span>
          <button className="settings-btn danger" onClick={onSignOut}>Sign Out</button>
        </div>

        <div className="section-label">Tags</div>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:16}}>
          <div className="chip-group">
            {TAGS.map(t=>(
              <div key={t} className="chip selected">{t}</div>
            ))}
          </div>
        </div>

        <div className="section-label">About</div>
        <div className="settings-row">
          <span className="settings-label">Tight Ship</span>
          <span className="settings-value">v1.0</span>
        </div>
      </div>
    </>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [tab, setTab] = useState('today');
  const [tasks, setTasks] = useState([]);
  const [goals, setGoals] = useState([]);
  const [rollovers, setRollovers] = useState([]);
  const [todayLog, setTodayLog] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showAdd, setShowAdd] = useState(false);
  const [deferTask, setDeferTask] = useState(null);

  // Auth listener
  useEffect(() => {
    _supa.auth.getSession().then(({ data: { session } }) => {
      setUser(session?.user || null);
      setAuthChecked(true);
    });
    const { data: { subscription } } = _supa.auth.onAuthStateChange((_evt, session) => {
      setUser(session?.user || null);
    });
    return () => subscription.unsubscribe();
  }, []);

  useEffect(() => { if (user) loadAll(); }, [user]);

  const loadAll = async () => {
    setLoading(true);
    if (!user) return;
    // Generate recurring tasks for today
    await _supa.rpc('generate_recurring_tasks', { p_user_id: user.id, p_date: today() });

    const [{ data: tasksData }, { data: goalsData }, { data: rolloversData }, { data: logData }] = await Promise.all([
      _supa.from('tasks').select('*').eq('user_id', user.id).order('sort_order').order('created_at'),
      _supa.from('goals').select('*').eq('user_id', user.id).order('created_at'),
      _supa.from('rollovers').select('*').eq('user_id', user.id),
      _supa.from('daily_log').select('*').eq('user_id', user.id).eq('log_date', today()).maybeSingle(),
    ]);
    setTasks(tasksData || []);
    setGoals(goalsData || []);
    setRollovers(rolloversData || []);
    setTodayLog(logData);
    setLoading(false);
  };

  const addItem = async (data, type) => {
    if (type === 'goal') {
      const { data: inserted } = await _supa.from('goals').insert({ ...data, user_id: user.id }).select().single();
      if (inserted) setGoals(g => [...g, inserted]);
    } else {
      const { data: inserted } = await _supa.from('tasks').insert({ ...data, user_id: user.id }).select().single();
      if (inserted) setTasks(t => [...t, inserted]);
    }
  };

  const checkTask = async (task) => {
    const newStatus = task.status === 'done' ? 'pending' : 'done';
    const update = { status: newStatus, completed_at: newStatus === 'done' ? new Date().toISOString() : null };
    await _supa.from('tasks').update(update).eq('id', task.id);
    setTasks(ts => ts.map(t => t.id === task.id ? { ...t, ...update } : t));
  };

  const deferTaskFn = async (task, reason) => {
    const tom = new Date(); tom.setDate(tom.getDate()+1);
    const tomStr = tom.toISOString().split('T')[0];
    // Insert rollover record
    await _supa.from('rollovers').insert({
      user_id: user.id, task_id: task.id,
      from_date: task.scheduled_date || today(),
      to_date: tomStr, reason: reason || null,
    });
    // Update task to tomorrow
    await _supa.from('tasks').update({ scheduled_date: tomStr, status: 'pending' }).eq('id', task.id);
    setTasks(ts => ts.map(t => t.id === task.id ? { ...t, scheduled_date: tomStr, status: 'pending' } : t));
    setRollovers(rs => [...rs, { task_id: task.id, from_date: today(), to_date: tomStr, reason }]);
  };

  const deleteTask = async (task) => {
    await _supa.from('tasks').delete().eq('id', task.id);
    setTasks(ts => ts.filter(t => t.id !== task.id));
  };

  const toggleGoal = async (goal) => {
    const newStatus = goal.status === 'complete' ? 'active' : 'complete';
    await _supa.from('goals').update({ status: newStatus }).eq('id', goal.id);
    setGoals(gs => gs.map(g => g.id === goal.id ? { ...g, status: newStatus } : g));
  };

  const deleteGoal = async (goal) => {
    await _supa.from('goals').delete().eq('id', goal.id);
    setGoals(gs => gs.filter(g => g.id !== goal.id));
  };

  const saveLog = async ({ reflection, intention }) => {
    const payload = { user_id: user.id, log_date: today(), reflection, intention };
    const { data } = await _supa.from('daily_log')
      .upsert(payload, { onConflict: 'user_id,log_date' }).select().single();
    if (data) setTodayLog(data);
  };

  const signOut = async () => { await _supa.auth.signOut(); setUser(null); };

  if (!authChecked) return <div className="loading" style={{height:'100vh'}}>LOADING...</div>;
  if (!user) return <AuthScreen onAuth={setUser}/>;

  const getDefaultTier = () => {
    if (tab === 'today') return 'daily';
    if (tab === 'weekly') return 'weekly';
    if (tab === 'monthly') return 'monthly';
    if (tab === 'yearly') return 'yearly';
    return 'daily';
  };

  const navItems = [
    { id: 'today',   icon: '✓',  label: 'Today'  },
    { id: 'weekly',  icon: '📆', label: 'Week'   },
    { id: 'monthly', icon: '🗓', label: 'Month'  },
    { id: 'yearly',  icon: '🎯', label: 'Year'   },
    { id: 'review',  icon: '🌙', label: 'Review' },
    { id: 'stats',   icon: '📊', label: 'Stats'  },
    { id: 'motivate',icon: '⚡', label: 'Fire'   },
    { id: 'settings',icon: '⚙', label: 'More'   },
  ];

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="topbar-logo">TIGHT SHIP</div>
        <div className="topbar-right">
          <div className="icon-btn" onClick={loadAll}>↺</div>
        </div>
      </div>

      <div className="page-content">
        <div className={`page${tab==='today'?' active':''}`}>
          <TodayPage tasks={tasks} rollovers={rollovers}
            onCheck={checkTask} onDefer={t=>setDeferTask(t)} onDelete={deleteTask} loading={loading}/>
        </div>
        <div className={`page${tab==='weekly'?' active':''}`}>
          <WeeklyPage tasks={tasks} rollovers={rollovers}
            onCheck={checkTask} onDefer={t=>setDeferTask(t)} onDelete={deleteTask} loading={loading}/>
        </div>
        <div className={`page${tab==='monthly'?' active':''}`}>
          <GoalsPage goals={goals} tasks={tasks} goalTier="monthly"
            onToggle={toggleGoal} onDelete={deleteGoal} loading={loading}/>
        </div>
        <div className={`page${tab==='yearly'?' active':''}`}>
          <GoalsPage goals={goals} tasks={tasks} goalTier="yearly"
            onToggle={toggleGoal} onDelete={deleteGoal} loading={loading}/>
        </div>
        <div className={`page${tab==='review'?' active':''}`}>
          <ReviewPage tasks={tasks} onSaveLog={saveLog} todayLog={todayLog}/>
        </div>
        <div className={`page${tab==='stats'?' active':''}`}>
          <StatsPage tasks={tasks} rollovers={rollovers}/>
        </div>
        <div className={`page${tab==='motivate'?' active':''}`}>
          <MotivatorPage userId={user.id}/>
        </div>
        <div className={`page${tab==='settings'?' active':''}`}>
          <SettingsPage user={user} onSignOut={signOut}/>
        </div>
      </div>

      {['today','weekly','monthly','yearly'].includes(tab) && (
        <button className="fab" onClick={()=>setShowAdd(true)}>+</button>
      )}

      <div className="bottom-nav">
        {navItems.map(n=>(
          <button key={n.id} className={`nav-item${tab===n.id?' active':''}`} onClick={()=>setTab(n.id)}>
            <span className="nav-icon">{n.icon}</span>
            {n.label}
          </button>
        ))}
      </div>

      {showAdd && (
        <AddItemModal
          onClose={()=>setShowAdd(false)}
          onSave={addItem}
          defaultTier={getDefaultTier()}
          goals={goals}
        />
      )}

      {deferTask && (
        <DeferModal
          task={deferTask}
          onClose={()=>setDeferTask(null)}
          onDefer={deferTaskFn}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
